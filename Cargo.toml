[package]
name = "dsql-schema-migrate"
version = "0.1.0"
edition = "2024"
description = "Aurora DSQL 向けスキーマ管理 (psqldef diff + DSQL 方言変換 + 自前 applier)"
license = "MIT"
repository = "https://github.com/worgue/dsql-schema-migrate"
readme = "README.md"
keywords = ["aurora-dsql", "schema", "migration", "psqldef"]
categories = ["database", "command-line-utilities"]

[dependencies]
anyhow = "1"
aws-config = { version = "1", features = ["behavior-version-latest"] }
# default の `rustls` feature は legacy TLS スタック (rustls 0.21 / rustls-webpki 0.101) を
# 引き込むため外し、現行の HTTPS クライアント (default-https-client) だけを有効にする
aws-sdk-dsql = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-types = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
sea-orm = { version = "2", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process"] }
urlencoding = "2"
